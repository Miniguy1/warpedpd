name: Build my APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Use the permanent signing key (so every build installs over the last one)
        run: |
          mkdir -p ~/.android
          cp ci/personal-debug-key.bin ~/.android/debug.keystore

      - name: Stop the app nagging about the original author's releases
        run: sed -i "s#githubDebugImplementation project(':services:updates:githubUpdates')#githubDebugImplementation project(':services:updates:debugUpdates')#" android/build.gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the game's own tests for the new content
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :core:test --tests "xyz.gabriwar.warpedpixeldungeon.ModContentTest" --tests "xyz.gabriwar.warpedpixeldungeon.levels.overworld.WorldEdgeTest" --stacktrace 2>&1 | tee build.log

      - name: Build the APK
        run: |
          set -o pipefail
          ./gradlew :android:assembleGithubDebug -PappVersionCode=$((1000 + ${{ github.run_number }})) --stacktrace 2>&1 | tee -a build.log

      - name: Save the build errors to the repo so they can be read
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "FAILED$" build.log | sort -u | head -80 > errors.txt || true
          echo "-----" >> errors.txt
          grep -E -B1 "^\s+(java|org)\.[A-Za-z.]+(Error|Exception)" build.log | grep -v "^--" | head -250 >> errors.txt || true
          grep -nE -B2 -A8 "error:|What went wrong" build.log | head -60 >> errors.txt || true
          tail -40 build.log >> errors.txt
          gh api --method PUT "repos/${{ github.repository }}/contents/build-logs/errors-${{ github.run_number }}.txt" \
            -f message="build errors for run ${{ github.run_number }}" -f content="$(base64 -w0 errors.txt)" -f branch=main

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" android/build/outputs/apk/github/debug/*.apk \
            --repo "${{ github.repository }}" --title "My build ${{ github.run_number }}" --notes "My own Warped Pixel Dungeon build"
